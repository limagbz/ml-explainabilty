[project]
name = "ml-explainabilty"
description = "Implementation and Explanation of techniques used to explain machine learning models decisions"
authors = [{ name = "Gabriel Lima" }]
version = "0.1.0"
requires-python = "~=3.14.5"
readme = "README.md"
dependencies = ["jupyterlab>=4.5.7", "pyspark>=4.1.1"]

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-sugar==1.1.1",
  "ruff==0.15.12",
  "ty==0.0.35",
]

[tool.ty.rules]
ignore-comment-unknown-rule = "error"
invalid-enum-member-annotation = "error"
invalid-legacy-positional-parameter = "error"
invalid-named-tuple-override = "error"
mismatched-type-name = "error"
redundant-cast = "error"
unresolved-global = "error"

[tool.ruff]
indent-width = 4
line-length = 88
show-fixes = true

[tool.ruff.lint]
ignore = ["E501", "COM812"]
pydocstyle.convention = "google"
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.pytest]
addopts = ["--import-mode=importlib", "--cov", "--cov-report=term-missing"]

[tool.coverage.report]
show_missing = true
